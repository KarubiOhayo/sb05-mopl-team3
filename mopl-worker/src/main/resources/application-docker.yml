spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/mopl?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MOPL_DB_USERNAME:app}
    password: ${MOPL_DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: ${MOPL_DDL_AUTO:validate}
  kafka:
    bootstrap-servers: ${MOPL_KAFKA_BOOTSTRAP:kafka:29092}
    consumer:
      group-id: ${MOPL_KAFKA_GROUP_ID:mopl-worker}

server:
  port: ${MOPL_PORT:8082}

logging:
  level:
    org.hibernate.SQL: ${MOPL_SQL_LOG_LEVEL:debug}
