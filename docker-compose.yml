services:
  mysql:
    image: mysql:8.0
    container_name: mopl_mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mopl
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # (선택) 최초 생성 시 스키마 자동 실행
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    container_name: mopl_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    container_name: mopl_kafka
    hostname: kafka
    ports:
      # 호스트(내 PC)에서 접속하는 포트
      - "29092:9092"
    environment:
      # 단일 브로커 로컬 개발용 설정들
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # 내부(컨테이너)용 29092 / 컨트롤러 29093 / 외부(호스트)용 9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 단일 브로커에서 필요한 값들(복제 관련)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 로그 디렉토리(컨테이너 내부)
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft용 클러스터 ID (아무거나 쓰면 안되고, "한 번 정하면 유지"가 좋아)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mopl_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # 컨테이너 내부 접속 주소는 kafka:29092
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mopl_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./mopl-monitor/prometheus/${PROM_CONFIG:-prometheus-dev.yml}:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mopl_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./mopl-monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: mopl-api/Dockerfile
    container_name: mopl_api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MOPL_DB_USERNAME: ${MOPL_DB_USERNAME:-app}
      MOPL_DB_PASSWORD: ${MOPL_DB_PASSWORD:-app}
      MOPL_REDIS_HOST: redis
      MOPL_REDIS_PORT: 6379
      MOPL_KAFKA_BOOTSTRAP: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-characters-long-for-hs256-algorithm}
    depends_on:
      - mysql
      - redis
      - kafka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 30

  socket:
    build:
      context: .
      dockerfile: mopl-socket/Dockerfile
    container_name: mopl_socket
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MOPL_DB_USERNAME: ${MOPL_DB_USERNAME:-app}
      MOPL_DB_PASSWORD: ${MOPL_DB_PASSWORD:-app}
      MOPL_REDIS_HOST: redis
      MOPL_REDIS_PORT: 6379
      MOPL_KAFKA_BOOTSTRAP: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-characters-long-for-hs256-algorithm}
    depends_on:
      - mysql
      - redis
      - kafka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: mopl-worker/Dockerfile
    container_name: mopl_worker
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MOPL_DB_USERNAME: ${MOPL_DB_USERNAME:-app}
      MOPL_DB_PASSWORD: ${MOPL_DB_PASSWORD:-app}
      MOPL_KAFKA_BOOTSTRAP: kafka:29092
      MOPL_KAFKA_GROUP_ID: ${MOPL_KAFKA_GROUP_ID:-mopl-worker}
      GMAIL_EMAIL: ${GMAIL_EMAIL:-modu.s.playlist@gmail.com}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-bastthiphmzevlga}
    depends_on:
      - mysql
      - kafka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 30

  batch:
    build:
      context: .
      dockerfile: mopl-batch/Dockerfile
    container_name: mopl_batch
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MOPL_DB_USERNAME: ${MOPL_DB_USERNAME:-app}
      MOPL_DB_PASSWORD: ${MOPL_DB_PASSWORD:-app}
      MOPL_KAFKA_BOOTSTRAP: kafka:29092
      MOPL_BATCH_JOB_ENABLED: ${MOPL_BATCH_JOB_ENABLED:-false}
    depends_on:
      - mysql
      - kafka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:alpine
    container_name: mopl_gateway
    ports:
      - "8085:80"
    volumes:
      - ./mopl-gateway/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트 빌드 산출물 폴더를 여기에 연결
      - ./mopl-gateway/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  grafana_data:

