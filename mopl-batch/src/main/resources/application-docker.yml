spring:
  config:
    activate:
      on-profile: docker
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./mopl-batch/.env[.properties]"
  datasource:
    url: jdbc:mysql://mysql:3306/mopl?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MOPL_DB_USERNAME:app}
    password: ${MOPL_DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: ${MOPL_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${MOPL_KAFKA_BOOTSTRAP:kafka:29092}
  batch:
    job:
      enabled: ${MOPL_BATCH_JOB_ENABLED:false}
    jdbc:
      initialize-schema: ${MOPL_BATCH_SCHEMA_INIT:always}

server:
  port: ${MOPL_PORT:8083}

logging:
  level:
    org.hibernate.SQL: ${MOPL_SQL_LOG_LEVEL:debug}
