spring:
  application:
    name: mopl-batch
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: io.mopl.core.event.*

tmdb:
  access-token: ${TMDB_ACCESS_TOKEN:your-access-token-here}
  language: ${TMDB_LANGUAGE:ko-KR}
  max-pages:
    movie: ${TMDB_MAX_PAGES_MOVIE:10}
    tv-series: ${TMDB_MAX_PAGES_TV_SERIES:10}

tsdb:
  api-key: ${TSDB_API_KEY:123} # TSDB의 무료 API key는 123

batch:
  schedule:
    movie-collect-cron: ${BATCH_MOVIE_COLLECT_CRON:0 0 4 * * *}
    tv-series-collect-cron: ${BATCH_TV_SERIES_COLLECT_CRON:0 0 3 * * *}
    soccer-collect-cron: ${BATCH_SOCCER_COLLECT_CRON:0 0 2 * * *}
    watcher-snapshot-interval-ms: ${BATCH_WATCHER_SNAPSHOT_INTERVAL_MS:30000}
  watcher-es:
#    batch-size: ${BATCH_WATCHER_ES_BATCH_SIZE:100}
    batch-size: ${BATCH_WATCHER_ES_BATCH_SIZE:1}
    flush-interval-ms: ${BATCH_WATCHER_ES_FLUSH_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
