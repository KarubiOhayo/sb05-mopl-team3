# MOPL 서비스 메트릭 수집 설정 (배포)
# 배포 환경에 맞는 내부 주소/서비스 디스커버리로 targets 변경 ★★★★★

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mopl-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8080']

  - job_name: mopl-socket
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['socket:8081']

  - job_name: mopl-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker:8082']

  - job_name: mopl-batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['batch:8083']
